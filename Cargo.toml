[package]
name = "lau-ergodic-gradient"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kimi's Theorem 3: gradient descent as time-reversal of ergodic diffusion (Fokker-Planck). Bakry-Émery CD(K,∞), spectral gap, log-Sobolev, Wasserstein contraction, JKO scheme, and Fisher-Ricci curvature for optimization."
repository = "https://github.com/SuperInstance/lau-ergodic-gradient"

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
